<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BLINK TEST</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #00ff88;

    font-family: monospace;
}

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

#overlay {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.75) 100%
        );

    z-index: 2;
}

#scanlines {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 3;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0px,
            rgba(255,255,255,.045) 1px,
            transparent 2px,
            transparent 4px
        );
}

#status {
    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 10;

    padding: 10px;

    border: 1px solid #00ff88;

    background: rgba(0,0,0,.7);

    box-shadow:
        0 0 10px #00ff88;
}

#eyeStatus {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    font-size: 22px;

    padding: 10px 20px;

    background: rgba(0,0,0,.75);

    border: 1px solid #00ff88;

    box-shadow:
        0 0 15px #00ff88;

    text-align: center;
}

#calibration {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    z-index: 15;

    width: 85%;

    max-width: 400px;

    padding: 20px;

    background: rgba(0,0,0,.85);

    border: 1px solid #00ff88;

    box-shadow:
        0 0 25px #00ff88;

    text-align: center;

    display: none;
}

#progressOuter {
    width: 100%;

    height: 10px;

    border: 1px solid #00ff88;

    margin-top: 15px;
}

#progressInner {
    width: 0%;

    height: 100%;

    background: #00ff88;

    box-shadow:
        0 0 10px #00ff88;
}

#start {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    padding: 18px 30px;

    background: #000;

    color: #00ff88;

    border: 1px solid #00ff88;

    font-family: monospace;

    font-size: 18px;

    box-shadow:
        0 0 20px #00ff88;
}

button:active {
    background: #00ff88;
    color: #000;
}

.blink {
    color: red !important;

    border-color: red !important;

    box-shadow:
        0 0 15px red,
        0 0 40px red !important;

    text-shadow:
        0 0 10px red;
}

.glitch {
    animation:
        glitch .08s linear 3;
}

@keyframes glitch {

    0% {
        transform: translate(0);
    }

    25% {
        transform: translate(4px,-2px);
    }

    50% {
        transform: translate(-4px,2px);
    }

    75% {
        transform: translate(2px,3px);
    }

    100% {
        transform: translate(0);
    }
}

</style>

</head>

<body>


<video
    id="camera"
    autoplay
    playsinline>
</video>


<div id="overlay"></div>

<div id="scanlines"></div>


<div id="status">
    SYSTEM: OFFLINE
</div>


<div id="eyeStatus">
    CAMERA OFF
</div>


<div id="calibration">

    <div id="calibrationText">
        CALIBRATING...
    </div>

    <div id="progressOuter">
        <div id="progressInner"></div>
    </div>

</div>


<button
    id="start"
    onclick="startTest()">

    START BLINK TEST

</button>


<script>


/* =================================
   ELEMANLAR
================================= */

const video =
    document.getElementById("camera");

const status =
    document.getElementById("status");

const eyeStatus =
    document.getElementById("eyeStatus");

const startButton =
    document.getElementById("start");

const calibration =
    document.getElementById("calibration");

const calibrationText =
    document.getElementById("calibrationText");

const progressInner =
    document.getElementById("progressInner");


/* =================================
   DEĞİŞKENLER
================================= */

let cameraStream = null;

let faceMesh = null;

let processing = false;

let blinkCount = 0;

let eyesClosed = false;

let closedSince = 0;


/*
   KALİBRASYON
*/

let calibrating = false;

let calibrationValues = [];

let calibrationStart = 0;

const CALIBRATION_TIME = 3000;


/*
   Kişinin normal göz açıklığı.
*/

let normalEyeRatio = 0;


/*
   KAPANMA / AÇILMA EŞİKLERİ

   Bunlar normalEyeRatio'dan
   otomatik hesaplanacak.
*/

let closeThreshold = 0;

let openThreshold = 0;


/* =================================
   MESAFE
================================= */

function distance(a, b) {

    const x =
        a.x - b.x;

    const y =
        a.y - b.y;

    return Math.sqrt(
        x * x + y * y
    );
}


/* =================================
   GÖZ ORANI
================================= */

function eyeRatio(
    top,
    bottom,
    left,
    right,
    top2,
    bottom2
) {

    const vertical1 =
        distance(top, bottom);

    const vertical2 =
        distance(top2, bottom2);

    const horizontal =
        distance(left, right);

    if (horizontal === 0) {
        return 0;
    }

    return (
        vertical1 +
        vertical2
    ) / (
        2 * horizontal
    );
}


/* =================================
   İKİ GÖZÜN ORTALAMASI
================================= */

function getEyeRatio(landmarks) {


    const leftEye =
        eyeRatio(

            landmarks[160],
            landmarks[144],

            landmarks[33],
            landmarks[133],

            landmarks[158],
            landmarks[153]

        );


    const rightEye =
        eyeRatio(

            landmarks[385],
            landmarks[380],

            landmarks[362],
            landmarks[263],

            landmarks[387],
            landmarks[373]

        );


    return (
        leftEye +
        rightEye
    ) / 2;
}


/* =================================
   KALİBRASYON
================================= */

function calibrate(ratio) {

    if (!calibrating) {
        return;
    }


    /*
       Gözleri normal şekilde açık
       tutarken değerleri topluyoruz.
    */

    calibrationValues.push(ratio);


    const elapsed =
        Date.now() -
        calibrationStart;


    const progress =
        Math.min(
            elapsed /
            CALIBRATION_TIME,
            1
        );


    progressInner.style.width =
        (progress * 100) + "%";


    calibrationText.innerText =
        "KEEP YOUR EYES OPEN\n\n" +
        "CALIBRATING " +
        Math.round(progress * 100) +
        "%";


    if (
        elapsed >=
        CALIBRATION_TIME
    ) {

        finishCalibration();

    }
}


/* =================================
   KALİBRASYONU BİTİR
================================= */

function finishCalibration() {

    if (
        calibrationValues.length === 0
    ) {
        return;
    }


    /*
       Ortalama yerine medyan
       kullanıyoruz.

       Böylece kalibrasyon sırasında
       yanlışlıkla kırpman sonucu
       daha az etkilenir.
    */

    const sorted =
        [...calibrationValues]
            .sort(
                (a,b) => a-b
            );


    const middle =
        Math.floor(
            sorted.length / 2
        );


    normalEyeRatio =
        sorted[middle];


    /*
       Normal açıklığın yaklaşık
       %55 altına düşerse kapalı.

       Açılma eşiğini biraz daha
       yukarı koyuyoruz.
    */

    closeThreshold =
        normalEyeRatio * 0.55;

    openThreshold =
        normalEyeRatio * 0.72;


    calibrating = false;

    calibration.style.display =
        "none";


    status.innerText =
        "SYSTEM: ONLINE\n" +
        "CALIBRATED";

    eyeStatus.innerText =
        "EYES OPEN";


    console.log(
        "Normal:",
        normalEyeRatio
    );

    console.log(
        "Close:",
        closeThreshold
    );

    console.log(
        "Open:",
        openThreshold
    );
}


/* =================================
   BLINK
================================= */

function checkBlink(ratio) {


    /*
       KALİBRASYON DEVAM EDİYORSA
    */

    if (calibrating) {

        calibrate(ratio);

        return;
    }


    /*
       KALİBRASYON TAMAMLANMAMIŞSA
    */

    if (
        normalEyeRatio === 0
    ) {
        return;
    }


    /*
       GÖZLER AÇIKKEN
    */

    if (!eyesClosed) {

        if (
            ratio <
            closeThreshold
        ) {

            eyesClosed = true;

            closedSince =
                Date.now();


            eyeStatus.innerText =
                "EYES CLOSED";

            eyeStatus.classList.add(
                "blink"
            );
        }

        else {

            eyeStatus.innerText =
                "EYES OPEN";

            eyeStatus.classList.remove(
                "blink"
            );
        }

        return;
    }


    /*
       GÖZLER KAPALIYKEN
       tekrar açılmasını bekle
    */

    if (
        ratio >
        openThreshold
    ) {

        const duration =
            Date.now() -
            closedSince;


        /*
           Normal kısa kapanma
           = BLINK
        */

        if (
            duration >= 80 &&
            duration < 1200
        ) {

            blinkCount++;


            eyeStatus.innerText =
                "BLINK DETECTED";


            eyeStatus.classList.add(
                "blink"
            );


            document.body
                .classList.add(
                    "glitch"
                );


            setTimeout(() => {

                document.body
                    .classList.remove(
                        "glitch"
                    );

                eyeStatus.classList.remove(
                    "blink"
                );

            }, 400);


            status.innerText =
                "SYSTEM: ONLINE\n" +
                "BLINKS: " +
                blinkCount;
        }


        eyesClosed = false;
    }
}


/* =================================
   MEDIAPIPE
================================= */

function setupFaceMesh() {

    faceMesh =
        new FaceMesh({

            locateFile: (
                file
            ) => {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" +
                    file
                );
            }

        });


    faceMesh.setOptions({

        maxNumFaces: 1,

        refineLandmarks: true,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });


    faceMesh.onResults(
        results => {


            if (
                results.multiFaceLandmarks &&
                results.multiFaceLandmarks.length > 0
            ) {


                const landmarks =
                    results
                        .multiFaceLandmarks[0];


                const ratio =
                    getEyeRatio(
                        landmarks
                    );


                status.innerText =
                    "SYSTEM: ONLINE\n" +
                    "FACE: DETECTED\n" +
                    "BLINKS: " +
                    blinkCount;


                checkBlink(ratio);


            }

            else {

                status.innerText =
                    "SYSTEM: ONLINE\n" +
                    "FACE: NOT FOUND";


                if (!calibrating) {

                    eyeStatus.innerText =
                        "NO FACE";

                }
            }
        }
    );
}


/* =================================
   KAMERA
================================= */

async function startCamera() {

    try {

        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        await video.play();


        return true;

    }

    catch (error) {

        status.innerText =
            "CAMERA ERROR:\n" +
            error.name;


        console.error(error);


        return false;
    }
}


/* =================================
   KAMERA İŞLEME
================================= */

async function processCamera() {

    if (
        !faceMesh ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            processCamera
        );

        return;
    }


    if (!processing) {

        processing = true;


        try {

            await faceMesh.send({
                image: video
            });

        }

        catch (error) {

            console.error(error);

        }


        processing = false;
    }


    requestAnimationFrame(
        processCamera
    );
}


/* =================================
   KALİBRASYONU BAŞLAT
================================= */

function startCalibration() {

    calibrationValues = [];

    normalEyeRatio = 0;

    closeThreshold = 0;

    openThreshold = 0;

    calibrating = true;

    calibrationStart =
        Date.now();


    calibration.style.display =
        "block";


    progressInner.style.width =
        "0%";


    calibrationText.innerText =
        "KEEP YOUR EYES OPEN\n\n" +
        "CALIBRATING 0%";
}


/* =================================
   BAŞLAT
================================= */

async function startTest() {

    startButton.style.display =
        "none";


    status.innerText =
        "SYSTEM: STARTING...";


    eyeStatus.innerText =
        "REQUESTING CAMERA";


    const cameraOK =
        await startCamera();


    if (!cameraOK) {

        startButton.style.display =
            "block";

        eyeStatus.innerText =
            "CAMERA FAILED";

        return;
    }


    status.innerText =
        "SYSTEM: LOADING FACE MODEL...";


    setupFaceMesh();


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1000
            )
    );


    startCalibration();


    processCamera();
}

</script>

</body>
      </html>
